<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LoveTalk - 1:1 Audio Chat</title>

    <script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>

    <style>
        body {
            background: radial-gradient(circle at 50% 50%, #0d0d0d, #000000 80%);
            font-family: 'Orbitron', sans-serif;
            color: #0ff;
        }

        .neon-border {
            border: 2px solid #0ff;
            box-shadow: 0 0 10px #0ff, inset 0 0 10px #0ff;
        }

        .neon-btn {
            background: transparent;
            border: 2px solid #0ff;
            color: #0ff;
            transition: all 0.2s;
        }

        .neon-btn:hover {
            background: #0ff;
            color: #000;
            box-shadow: 0 0 20px #0ff;
        }

        .voice-bar {
            width: 10px;
            background: #0ff;
            height: 10px;
            margin: 0 2px;
            border-radius: 4px;
            transition: height 0.1s;
            box-shadow: 0 0 8px #0ff;
        }

        .voice-visualizer {
            display: flex;
            align-items: flex-end;
            height: 40px;
            justify-content: center;
        }

        /* toast */
        #toast {
            position: fixed;
            top: 18px;
            right: 18px;
            z-index: 60;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .toast-item {
            background: rgba(0, 0, 0, 0.75);
            border: 1px solid #0ff;
            color: #0ff;
            padding: 8px 12px;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.6);
            font-size: 13px;
        }

        /* chat scrollbar small styling */
        .scrollbox::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        .scrollbox::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 255, 0.15);
            border-radius: 8px;
        }

        /* Chatbox */
        /* modern glass chat box */
        .chat-box {
            background: rgba(0, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(0, 255, 255, 0.2);
            border-radius: 14px;
            box-shadow: 0 0 12px rgba(0, 255, 255, 0.2);
        }

        /* chat bubbles */
        .msg-wrapper {
            margin-bottom: 10px;
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .msg-you {
            align-self: flex-end;
            background: #0ff;
            color: #000;
            border-radius: 10px 10px 0 10px;
            padding: 8px 12px;
            font-size: 14px;
            box-shadow: 0px 0px 10px rgba(0, 255, 255, 0.4);
        }

        .msg-other {
            align-self: flex-start;
            background: #012b2b;
            border: 1px solid rgba(0, 255, 255, 0.2);
            color: #0ff;
            border-radius: 10px 10px 10px 0;
            padding: 8px 12px;
            font-size: 14px;
        }

        .msg-time {
            font-size: 10px;
            opacity: 0.6;
            margin-top: 4px;
            color: #0ff;
            text-align: right;
        }

        /* smooth scroll */
        .scrollbox {
            scrollbar-width: thin;
            scrollbar-color: rgba(0, 255, 255, 0.3) transparent;
        }

        .scrollbox::-webkit-scrollbar {
            width: 6px;
        }

        .scrollbox::-webkit-scrollbar-thumb {
            background: rgba(0, 255, 255, 0.3);
            border-radius: 10px;
        }

        .scrollbox::-webkit-scrollbar-track {
            background: transparent;
        }
    </style>
</head>

<body class="min-h-screen p-6 flex items-center justify-center">

    <div class="w-full max-w-4xl space-y-6">

        <header class="flex items-center justify-between">
            <h1 class="text-3xl font-bold text-[#0ff]">LoveTalk — Where Love Begins</h1>
            <div class="text-sm text-[#0ff]">Room:
                <span id="roomLabel" class="font-mono text-[#00ffff]"></span>
            </div>
        </header>

        <main class="grid grid-cols-1 md:grid-cols-3 gap-6">

            <!-- left column: Peer ID, controls, visualizer -->
            <section class="col-span-1 neon-border rounded-xl p-4">
                <p class="text-sm text-[#0ff] mb-1">Your ID</p>
                <div class="flex items-center justify-between mb-2">
                    <div id="peerId" class="font-mono text-[#00ffff]">Initializing...</div>
                    <div class="flex gap-2">
                        <button id="copyPeerId" class="neon-btn px-3 py-1 rounded text-sm">Copy</button>
                    </div>
                </div>

                <p id="status" class="text-xs text-[#0ff] mb-3">Status: Starting...</p>

                <div id="controls" class="hidden flex gap-2 mb-3">
                    <button id="muteBtn" class="neon-btn px-3 py-1 rounded">Mute</button>
                    <button id="hangupBtn"
                        class="neon-btn px-3 py-1 rounded border-red-500 text-red-400 hover:bg-red-500 hover:text-black">Hang
                        Up</button>
                </div>

                <div>
                    <p class="text-xs text-[#0ff] mb-1">Remote Voice Level</p>
                    <div id="voiceVisualizer" class="voice-visualizer"></div>
                </div>

                <audio id="remoteAudio" autoplay></audio>
            </section>

            <!-- Video -->
            <div class="mt-4">
                <p class="text-xs text-[#0ff] mb-1">Video Preview</p>

                <div class="flex gap-2">
                    <video id="localVideo" autoplay muted playsinline class="w-1/2 rounded-lg shadow"></video>
                    <video id="remoteVideo" autoplay playsinline class="w-1/2 rounded-lg shadow"></video>
                </div>
            </div>

            <!-- center column: Chat -->
            <section class="col-span-1 md:col-span-2 neon-border rounded-xl p-4 flex flex-col">

                <div class="flex items-center justify-between mb-3">
                    <div class="text-sm text-[#0ff] font-semibold">Chat</div>
                    <div class="text-xs text-[#0ff]" id="activeCount">Active: 0</div>
                </div>

                <!-- modern chat container -->
                <div id="messages" class="chat-box flex-1 overflow-y-scroll scrollbox p-4 h-72">
                </div>

                <!-- input row -->
                <div class="mt-3 flex items-center gap-2">
                    <input id="chatInput"
                        class="flex-1 bg-[#001010] border border-cyan-600 rounded px-3 py-2 text-[#0ff] focus:outline-none"
                        placeholder="Write a message..." />

                    <button id="sendBtn" class="neon-btn px-4 py-2 rounded">
                        Send
                    </button>
                </div>

            </section>

            <!-- right column: Active users -->
            <aside class="col-span-1 neon-border rounded-xl p-4">
                <div class="flex items-center justify-between mb-3">
                    <div class="text-sm text-[#0ff]">Active Users</div>
                    <button id="refreshUsers" class="text-xs neon-btn px-2 py-1 rounded">Refresh</button>
                </div>

                <ul id="activeUsers" class="space-y-2 text-sm text-[#0ff]"></ul>

                <div class="mt-4 text-xs text-[#0ff]">Notifications appear top-right.</div>
            </aside>

        </main>

        <div id="logs" class="neon-border rounded-xl p-3 mt-4 text-xs h-28 overflow-y-auto scrollbox bg-black/70"></div>
    </div>

    <!-- toasts -->
    <div id="toast"></div>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            // UI refs
            const ui = {
                logBox: document.getElementById("logs"),
                peerIdEl: document.getElementById("peerId"),
                statusEl: document.getElementById("status"),
                controlsEl: document.getElementById("controls"),
                muteBtn: document.getElementById("muteBtn"),
                hangupBtn: document.getElementById("hangupBtn"),
                copyBtn: document.getElementById("copyPeerId"),
                remoteAudio: document.getElementById("remoteAudio"),
                visualizer: document.getElementById("voiceVisualizer"),
                messages: document.getElementById("messages"),
                chatInput: document.getElementById("chatInput"),
                sendBtn: document.getElementById("sendBtn"),
                activeUsers: document.getElementById("activeUsers"),
                activeCount: document.getElementById("activeCount"),
                refreshUsers: document.getElementById("refreshUsers"),
                roomLabel: document.getElementById("roomLabel"),
                toast: document.getElementById("toast"),
                localVideo: document.getElementById("localVideo"),
                remoteVideo: document.getElementById("remoteVideo"),
            };

            function log(msg, level = "info") {
                const time = new Date().toLocaleTimeString();
                const line = document.createElement("div");
                line.textContent = `[${time}] ${msg}`;
                if (level === "error") line.classList.add("text-red-400");
                if (level === "warn") line.classList.add("text-yellow-300");
                ui.logBox.appendChild(line);
                ui.logBox.scrollTop = ui.logBox.scrollHeight;
                if (level === "error") console.error(msg); else if (level === "warn") console.warn(msg); else console.log(msg);
            }

            function toast(text, ttl = 4000) {
                const node = document.createElement("div");
                node.className = "toast-item";
                node.textContent = text;
                ui.toast.appendChild(node);
                setTimeout(() => { node.style.opacity = "0"; node.addEventListener("transitionend", () => node.remove()); }, ttl - 300);
                setTimeout(() => node.remove(), ttl);
            }

            // parse room and optional targetPeer from URL
            const params = new URLSearchParams(location.search);
            const roomId = params.get("id") || "default-room";
            ui.roomLabel.textContent = roomId;

            const state = {
                peer: null,
                socket: null,
                localStream: null,
                currentCall: null,
                isMuted: false,
                analyser: null,
                pendingIncomingCall: null,
                pendingRemoteUserId: null,
                peerInitAttempts: 0,
                maxPeerInitAttempts: 3,
                myPeerId: null,
                activeUsersList: [],
            };

            // ----- Socket init -----
            function initSocket() {
                state.socket = io(); // auto-connect to same origin

                state.socket.on("connect", () => {
                    log("Socket connected: " + state.socket.id);
                });

                state.socket.on("connect_error", (err) => {
                    log("Socket connect error: " + (err && err.message), "error");
                    toast("Socket error");
                });

                // server sends a current members list
                state.socket.on("active-users", (users) => {
                    log("Active users list updated (" + users.length + ")");
                    state.activeUsersList = users;
                    renderActiveUsers(users);
                });

                // join/leave notifications
                state.socket.on("user-joined", (userId) => {
                    log("User joined: " + userId);
                    toast("User joined: " + userId);
                    // if we have local stream and not in call, auto-call (matching-style)
                    if (!state.currentCall && state.localStream && state.myPeerId && userId !== state.myPeerId) {
                        // prefer to call only if newcomer isn't us
                        startOutgoingCall(userId);
                    }
                });

                state.socket.on("user-left", (userId) => {
                    log("User left: " + userId);
                    toast("User left: " + userId);
                    // if that user was our currentCall peer, hang up
                    if (state.currentCall && state.currentCall.peer === userId) {
                        cleanupCall("Partner left");
                    }
                });

                // chat messages
                state.socket.on("chat-message", (payload) => {
                    appendMessage(payload.from, payload.text, payload.me === false);
                });

                state.socket.on("typing", (userId) => {
                    // small ephemeral notice
                    const el = document.createElement("div");
                    el.className = "text-xs text-[#00ffff]";
                    el.textContent = `${userId} is typing...`;
                    ui.messages.appendChild(el);
                    setTimeout(() => el.remove(), 1200);
                });
            }

            // ----- PeerJS init with retry -----
            const iceConfig = {
                iceServers: [
                    { urls: "stun:stun.l.google.com:19302" },
                    { urls: "stun:stun1.l.google.com:19302" },
                    {
                        urls: [
                            "turn:relay1.expressturn.com:3480?transport=udp",
                            "turn:relay1.expressturn.com:3480?transport=tcp"
                        ],
                        username: "000000002078920456",
                        credential: "7au5gxraKlawrx09qC45ARXNpoM="
                    },
                    {
                        urls: [
                            "stun:bn-turn2.xirsys.com",
                            "turn:bn-turn2.xirsys.com:80?transport=udp",
                            "turn:bn-turn2.xirsys.com:3478?transport=udp",
                            "turn:bn-turn2.xirsys.com:80?transport=tcp",
                            "turn:bn-turn2.xirsys.com:3478?transport=tcp",
                            "turns:bn-turn2.xirsys.com:443?transport=tcp",
                            "turns:bn-turn2.xirsys.com:5349?transport=tcp"
                        ],
                        username:
                            "IV3rRPe9k4M8o1GyU7564eGUVmdQWRQXD5vHZIclMog1gOW9ixXSmbMYX79syFHNAAAAAGkdzuF0YXJpa3VsNzg=",
                        credential: "ef63c548-c550-11f0-b337-0242ac140004"
                    },
                ],
            };

            function initPeer() {
                if (state.peer && !state.peer.destroyed) {
                    try { state.peer.destroy(); } catch (e) { }
                }
                state.peerInitAttempts += 1;
                log("Initializing PeerJS (attempt " + state.peerInitAttempts + ")");
                ui.peerIdEl.textContent = "Initializing...";

                const peer = new Peer(undefined, {
                    host: "0.peerjs.com",
                    port: 443,
                    path: "/",
                    secure: true,
                    debug: 2,
                    config: iceConfig,
                });
                state.peer = peer;

                peer.on("open", (id) => {
                    state.myPeerId = id;
                    log("Peer open: " + id);
                    ui.peerIdEl.textContent = id;
                    ui.statusEl.textContent = "Status: Waiting for Partner...";
                    // let server know we joined (socket must be ready)
                    if (state.socket && state.socket.connected) {
                        state.socket.emit("join-room", roomId, id);
                        log("Joined room via socket");
                    } else {
                        log("Socket not ready when peer opened", "warn");
                    }

                    // if URL had target query param (quick call)
                    const params = new URLSearchParams(location.search);
                    const target = params.get("target");
                    if (target && target !== id) {
                        // queue or call
                        state.pendingRemoteUserId = target;
                        if (state.localStream) startOutgoingCall(target);
                    }
                });

                peer.on("call", (call) => {
                    log("Incoming call from: " + call.peer);
                    if (state.currentCall) {
                        log("Already in call, closing new call", "warn");
                        call.close();
                        return;
                    }
                    if (!state.localStream) {
                        log("Local stream not ready, queue incoming call", "warn");
                        state.pendingIncomingCall = call;
                        return;
                    }
                    answerCall(call);
                });

                peer.on("error", (err) => {
                    log("Peer error: " + (err && err.type) + " - " + (err && err.message), "error");
                    ui.statusEl.textContent = "Status: Peer error";
                    if ((err && (err.type === "network" || err.type === "server-error")) && state.peerInitAttempts < state.maxPeerInitAttempts) {
                        setTimeout(initPeer, 2000);
                    }
                });

                peer.on("disconnected", () => {
                    log("Peer disconnected, trying to reconnect", "warn");
                    ui.statusEl.textContent = "Status: Reconnecting...";
                    try { peer.reconnect(); } catch (e) { log("Reconnect failed: " + e.message, "error"); }
                });

                peer.on("close", () => {
                    log("Peer closed", "warn");
                    ui.statusEl.textContent = "Status: Peer closed";
                    if (state.peerInitAttempts < state.maxPeerInitAttempts) setTimeout(initPeer, 2000);
                });
            }

            // ----- Media (mic) init -----
            function initMedia() {
                ui.statusEl.textContent = "Status: Waiting for microphone permission...";
                navigator.mediaDevices.getUserMedia({
                    audio: true,
                    video: true
                })

                    .then((stream) => {
                        state.localStream = stream;
                        ui.localVideo.srcObject = stream;
                        ui.statusEl.textContent = "Status: Ready";
                        log("Microphone access granted");
                        if (state.pendingIncomingCall) { answerCall(state.pendingIncomingCall); state.pendingIncomingCall = null; }
                        if (state.pendingRemoteUserId) { startOutgoingCall(state.pendingRemoteUserId); state.pendingRemoteUserId = null; }
                    })
                    .catch((err) => {
                        ui.statusEl.textContent = "Status: Mic permission denied";
                        log("Microphone access denied: " + err.message, "error");
                        toast("Microphone permission needed for calls");
                    });
            }

            // ----- Calls -----
            function answerCall(call) {
                state.currentCall = call;
                call.answer(state.localStream);
                setupCallHandlers(call);
            }

            function startOutgoingCall(userId) {
                if (!state.peer || state.peer.disconnected || state.peer.destroyed) {
                    log("Cannot start call, peer not ready", "error"); return;
                }
                if (userId === state.myPeerId) { log("Skipping call to self"); return; }
                state.currentCall = state.peer.call(userId, state.localStream);
                log("Calling: " + userId);
                setupCallHandlers(state.currentCall);
            }

            function setupCallHandlers(call) {
                ui.statusEl.textContent = "Status: Connecting...";
                ui.controlsEl.classList.remove("hidden");

                call.on("stream", (remoteStream) => {
                    ui.statusEl.textContent = "Status: Connected";
                    log("Remote stream received");
                    ui.remoteVideo.srcObject = remoteStream;
                    ui.remoteAudio.srcObject = remoteStream;
                    startVisualizer(remoteStream);
                });

                call.on("close", () => {
                    log("Call closed");
                    cleanupCall("Call ended");
                });

                call.on("error", (err) => {
                    log("Call error: " + (err && err.message), "error");
                    cleanupCall("Call error");
                });
            }

            function cleanupCall(msg) {
                ui.statusEl.textContent = "Status: " + msg;
                ui.remoteAudio.srcObject = null;
                state.currentCall = null;
                ui.controlsEl.classList.add("hidden");
                ui.visualizer.innerHTML = "";
            }

            // visualizer
            function startVisualizer(stream) {
                try {
                    const ctx = new AudioContext();
                    const src = ctx.createMediaStreamSource(stream);
                    const analyser = ctx.createAnalyser();
                    analyser.fftSize = 64;
                    src.connect(analyser);
                    state.analyser = analyser;
                    ui.visualizer.innerHTML = "";
                    const bars = [];
                    for (let i = 0; i < 16; i++) {
                        const bar = document.createElement("div");
                        bar.className = "voice-bar";
                        ui.visualizer.appendChild(bar);
                        bars.push(bar);
                    }
                    function render() {
                        if (!state.analyser) return;
                        const data = new Uint8Array(state.analyser.frequencyBinCount);
                        state.analyser.getByteFrequencyData(data);
                        for (let i = 0; i < bars.length; i++) {
                            bars[i].style.height = Math.max(4, data[i] / 4) + "px";
                        }
                        requestAnimationFrame(render);
                    }
                    render();
                } catch (e) { log("Visualizer error: " + e.message, "warn"); }
            }

            // ----- Chat UI and handlers -----
            function appendMessage(from, text, isIncoming = true) {
                const wrap = document.createElement("div");
                wrap.className = "msg-wrapper";

                const bubble = document.createElement("div");
                bubble.className = isIncoming ? "msg-other" : "msg-you";
                bubble.textContent = text;

                const time = document.createElement("div");
                time.className = "msg-time";
                time.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });

                wrap.appendChild(bubble);
                wrap.appendChild(time);

                ui.messages.appendChild(wrap);

                // auto-scroll to bottom smoothly
                ui.messages.scrollTo({
                    top: ui.messages.scrollHeight,
                    behavior: "smooth"
                });
            }


            ui.sendBtn.addEventListener("click", sendChat);
            ui.chatInput.addEventListener("keydown", (e) => {
                if (e.key === "Enter") sendChat();
                else state.socket && state.socket.emit("typing", roomId, state.myPeerId);
            });

            function sendChat() {
                const text = ui.chatInput.value.trim();
                if (!text) return;
                // append locally and send
                appendMessage("You", text, false);
                ui.chatInput.value = "";
                if (state.socket && state.socket.connected) {
                    state.socket.emit("chat-message", { roomId, text, from: state.myPeerId });
                }
            }

            // ----- Active users rendering -----
            function renderActiveUsers(users) {
                ui.activeUsers.innerHTML = "";
                ui.activeCount.textContent = `Active: ${users.length}`;
                users.forEach(uid => {
                    const li = document.createElement("li");
                    li.className = "flex items-center justify-between";
                    const left = document.createElement("div");
                    left.className = "truncate";
                    left.title = uid;
                    left.textContent = uid === state.myPeerId ? uid + " (you)" : uid;
                    // clickable link area - open same page with ?id=<room>&target=<peer>
                    left.style.cursor = "pointer";
                    left.addEventListener("click", () => {
                        if (uid === state.myPeerId) { toast("That's you."); return; }
                        // open same page with target param so user can call quickly
                        const url = new URL(location.href);
                        url.searchParams.set("id", roomId);
                        url.searchParams.set("target", uid);
                        // open in new tab to keep session
                        window.open(url.toString(), "_blank");
                    });

                    const right = document.createElement("div");
                    right.className = "text-xs";
                    const callBtn = document.createElement("button");
                    callBtn.className = "neon-btn px-2 py-0.5 rounded text-xs";
                    callBtn.textContent = "Call";
                    callBtn.addEventListener("click", (e) => {
                        e.stopPropagation();
                        if (uid === state.myPeerId) { toast("Cannot call yourself"); return; }
                        startOutgoingCall(uid);
                    });

                    right.appendChild(callBtn);
                    li.appendChild(left);
                    li.appendChild(right);
                    ui.activeUsers.appendChild(li);
                });
            }

            ui.refreshUsers.addEventListener("click", () => {
                if (state.socket) state.socket.emit("request-active-users", roomId);
            });

            // ----- UI events: mute, hangup, copy -----
            ui.muteBtn.addEventListener("click", () => {
                if (!state.localStream) { log("Mute: no local stream", "warn"); return; }
                state.isMuted = !state.isMuted;
                state.localStream.getAudioTracks().forEach(t => t.enabled = !state.isMuted);
                ui.muteBtn.textContent = state.isMuted ? "Unmute" : "Mute";
                log("Mic " + (state.isMuted ? "muted" : "unmuted"));
            });

            ui.hangupBtn.addEventListener("click", () => {
                if (state.currentCall) state.currentCall.close();
                cleanupCall("You hung up");
            });

            ui.copyBtn.addEventListener("click", () => {
                const id = ui.peerIdEl.textContent || "";
                if (!id || id === "Initializing...") { alert("Peer ID not ready"); return; }
                navigator.clipboard.writeText(id);
                log("Peer ID copied");
                toast("Peer ID copied");
            });

            // ----- bootstrapping -----
            initSocket();
            initMedia();
            initPeer();

            // request active users after socket + peer known
            setTimeout(() => {
                if (state.socket && state.socket.connected && state.myPeerId) {
                    state.socket.emit("request-active-users", roomId);
                }
            }, 1200);

        });
    </script>
</body>

</html>
